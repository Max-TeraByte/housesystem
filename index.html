<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clasificaci&oacute;n de Casas &middot; North Hill Education System</title>
    <meta
      name="description"
      content="Clasificaci&oacute;n en vivo de las casas del North Hill Education System: Wolves, Falcons, Lions y Bears."
    />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/logos/wolves.png" />
    <meta property="og:title" content="Clasificaci&oacute;n de Casas &middot; North Hill Education System" />
    <meta property="og:description" content="Clasificaci&oacute;n en vivo de las casas del North Hill Education System." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/background1.jpg" />
    <link rel="preload" as="image" href="assets/background1.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body class="board-body">
    <div class="board">
      <div class="board__media" aria-hidden="true">
        <img
          src="assets/background1.jpg"
          srcset="assets/background1-small.jpg 1000w, assets/background1.jpg 2000w"
          sizes="100vw"
          alt=""
          fetchpriority="high"
        />
      </div>

      <header class="board__bar">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="M12 2.6 20 6v6.3c0 4.2-3.2 7.6-8 9.1-4.8-1.5-8-4.9-8-9.1V6z" />
            <path d="M12 7.6v8.4M8.4 11.8h7.2" stroke-linecap="round" />
          </svg>
          <div class="brand__text">
            <div class="brand__name" data-i18n="brand.school">North Hill Education System</div>
            <div class="brand__sub" data-i18n="brand.sub">Sistema de Casas</div>
          </div>
        </div>

        <nav class="board__nav" aria-label="Site">
          <span id="languageSlot"></span>
          <button class="ghost-btn ghost-btn--icon" id="themeToggle" type="button" data-i18n-label="nav.toggleDark" data-i18n-title="nav.toggleDark">
            <span data-theme-icon></span>
          </button>
          <a class="ghost-btn ghost-btn--icon" href="staff.html" data-i18n-label="nav.staffSignIn" data-i18n-title="nav.staffSignIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10.5" width="16" height="10.5" rx="2" />
              <path d="M8.2 10.5V7.4a3.8 3.8 0 0 1 7.6 0v3.1" />
            </svg>
          </a>
        </nav>
      </header>

      <main class="board__main">
        <div class="board__head">
          <span class="board__eyebrow" id="seasonLabel" data-i18n="hero.eyebrow">Sistema de Casas</span>
          <h1 class="board__title" data-i18n="hero.title">Clasificaci&oacute;n de Casas</h1>
        </div>

        <div id="errorSlot"></div>

        <div class="board__grid" id="houseGrid"></div>

        <p class="board__hint" data-i18n="board.tapHint">Toque una casa para ver sus &uacute;ltimos cambios</p>
      </main>

      <footer class="board__foot">
        <span class="board__status">
          <span class="live-dot" id="liveDot" data-state="connecting"></span>
          <span id="liveLabel" data-i18n="hero.connecting">Conectando&hellip;</span>
        </span>
        <span class="board__status" id="updatedWrap">
          <span data-i18n="hero.updated">Actualizado</span>
          <strong id="updatedAt">&mdash;</strong>
        </span>
      </footer>
    </div>

    <div class="sheet-root" id="sheetRoot" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetHouse">
        <button class="sheet__close" id="sheetClose" type="button" data-i18n-label="board.close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>

        <div class="sheet__head">
          <img class="sheet__logo" id="sheetLogo" src="assets/logos/wolves.png" alt="" />
          <div class="sheet__id">
            <h2 class="sheet__house" id="sheetHouse">&mdash;</h2>
            <div class="sheet__points"><strong id="sheetPoints">0</strong> <span data-i18n="standings.points">Puntos</span></div>
          </div>
        </div>

        <div class="sheet__label" data-i18n="board.lastChanges">&Uacute;ltimos cambios</div>
        <div class="sheet__list" id="sheetList"></div>
      </div>
    </div>

    <script type="module" src="js/site.js"></script>
  </body>
</html>
