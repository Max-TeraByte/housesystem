<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P&aacute;gina no encontrada &middot; Sistema de Casas North Hill</title>
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card" style="text-align: center">
        <svg class="auth-card__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="margin-inline: auto">
          <path d="M12 2.6 20 6v6.3c0 4.2-3.2 7.6-8 9.1-4.8-1.5-8-4.9-8-9.1V6z" />
          <path d="M12 7.6v8.4M8.4 11.8h7.2" stroke-linecap="round" />
        </svg>
        <h1 class="auth-card__title" data-i18n="notFound.title">P&aacute;gina no encontrada</h1>
        <p class="auth-card__sub" data-i18n="notFound.text">La p&aacute;gina que busca no existe en el sitio del Sistema de Casas.</p>
        <div class="auth-card__actions"><a class="solid-btn" href="./" data-i18n="notFound.action">Ir a la clasificaci&oacute;n</a></div>
      </div>
    </div>
    <script type="module">
      import { applyStaticText } from "./js/i18n.js";
      try {
        const stored = localStorage.getItem("nhes.house.theme");
        const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
      applyStaticText();
    </script>
  </body>
</html>
